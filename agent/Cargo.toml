# SPDX-License-Identifier: MIT OR Apache-2.0

[workspace]
resolver = "3"
members = ["chalkboard-agent", "chalkboard-template"]
exclude = ["chalkboard-template/fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Signalare/Chalkboard"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
