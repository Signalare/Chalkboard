# SPDX-License-Identifier: MIT OR Apache-2.0
#
# Runs `just check` — every formatter, linter, build and test — exactly as
# contributors run it locally (CONTRIBUTING.md#code-style-and-checks).

name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: just check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.46.0

      # Version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # Toolchain comes from rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: agent

      - name: Install LLVM formatting tools
        run: |
          pipx install clang-format==23.1.3
          pipx install clang-tidy==23.1.3
          clang-format --version
          clang-tidy --version

      - name: Show shellcheck version
        run: shellcheck --version

      - run: just check
