#
# Universal MBR storage layout for dual A/B slots and persistent data (OS-003).

image chalkboard.img {
  hdimage {
    align = 4M
    disk-signature = 0x5349474e # "SIGN"
    extended-partition = 4
  }

  # Primary partition 1: autoboot.txt + bootloader recovery (OS-003, OS-011)
  partition autoboot {
    partition-type = 0xC
    bootable = "true"
    image = "autoboot.vfat"
  }

  # Primary partition 2: Slot A boot files (kernel, DTBs, overlays, config.txt, cmdline.txt)
  partition boot-a {
    partition-type = 0xC
    image = "boot-a.vfat"
  }

  # Primary partition 3: Slot B boot files (kernel, DTBs, overlays, config.txt, cmdline.txt)
  partition boot-b {
    partition-type = 0xC
    image = "boot-b.vfat"
  }

  # Logical partition 5: Slot A rootfs (SquashFS + dm-verity)
  partition rootfs-a {
    partition-type = 0x83
    image = "rootfs-a.squashfs"
  }

  # Logical partition 6: Slot B rootfs (SquashFS + dm-verity)
  partition rootfs-b {
    partition-type = 0x83
    image = "rootfs-b.squashfs"
  }

  # Logical partition 7: Persistent F2FS data partition (STO-008, STO-009)
  partition data {
    partition-type = 0x83
    image = "data.f2fs"
  }
}
